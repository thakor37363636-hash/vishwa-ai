
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1020">
<title>VISHWA AI</title>

<style>
:root {
  --bg:#0b1020;
  --panel:#141d32;
  --green:#06d6a0;
  --blue:#4285f4;
  --text:#eef3ff;
  --muted:#aab6cc;
  --red:#ff7777;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,"Noto Sans Gujarati",sans-serif;
}

body {
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:var(--bg);
  color:var(--text);
}

header {
  padding:17px;
  text-align:center;
  background:var(--panel);
  border-bottom:1px solid var(--green);
}

header h1 {
  color:var(--green);
  font-size:25px;
  letter-spacing:2px;
}

header p {
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
}

#chat-container {
  flex:1;
  overflow-y:auto;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:13px;
  scroll-behavior:smooth;
}

.message {
  max-width:88%;
  padding:13px 15px;
  border-radius:16px;
  line-height:1.6;
  font-size:15px;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}

.user-message {
  align-self:flex-end;
  background:#244b78;
  border-bottom-right-radius:4px;
}

.ai-message {
  align-self:flex-start;
  background:var(--panel);
  border:1px solid #245b58;
  border-bottom-left-radius:4px;
}

.error-message {
  align-self:center;
  width:100%;
  max-width:100%;
  text-align:center;
  color:var(--red);
  background:#321c29;
  border:1px solid var(--red);
}

.retry-btn {
  margin-top:10px;
  padding:8px 14px;
  border:1px solid var(--red);
  border-radius:20px;
  background:transparent;
  color:white;
  cursor:pointer;
}

#input-container {
  display:flex;
  gap:9px;
  padding:12px;
  background:var(--panel);
  border-top:1px solid #293750;
}

#user-input {
  flex:1;
  min-width:0;
  padding:13px 15px;
  border-radius:25px;
  border:1px solid #38516d;
  background:var(--bg);
  color:white;
  font-size:16px;
  outline:none;
}

#user-input:focus {
  border-color:var(--green);
}

#send-btn {
  padding:0 19px;
  border:0;
  border-radius:25px;
  background:var(--green);
  color:#071b19;
  font-weight:bold;
  cursor:pointer;
}

#send-btn:disabled {
  opacity:.5;
  cursor:not-allowed;
}

.loading {
  color:var(--green);
}

footer {
  text-align:center;
  color:var(--muted);
  font-size:11px;
  padding:5px;
  background:var(--panel);
}
</style>
</head>

<body>

<header>
  <h1>VISHWA AI</h1>
  <p>તમારો સ્માર્ટ AI સહાયક • Gujarati | Hindi | English</p>
</header>

<div id="chat-container">
  <div class="message ai-message">
    નમસ્તે! હું VISHWA AI છું. 😊
    તમે ગુજરાતી, હિન્દી અથવા અંગ્રેજીમાં પ્રશ્ન પૂછી શકો છો.
  </div>
</div>

<div id="input-container">
  <input
    type="text"
    id="user-input"
    placeholder="તમારો પ્રશ્ન અહીં લખો..."
    autocomplete="off"
  >
  <button id="send-btn" onclick="sendMessage()">મોકલો</button>
</div>

<footer>VISHWA AI • AI Assistant</footer>

<script>
const WEBHOOK_URL =
"https://aidomy.app.n8n.cloud/webhook/30350321-dece-4669-8878-ccd0261f1e62";

const chat = document.getElementById("chat-container");
const input = document.getElementById("user-input");
const sendBtn = document.getElementById("send-btn");

let busy = false;

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") sendMessage();
});

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = String(text);
  chat.appendChild(div);
  scrollBottom();
  return div;
}

function scrollBottom() {
  chat.scrollTop = chat.scrollHeight;
}

function getAIResponse(data) {
  if (Array.isArray(data)) {
    data = data[0] || {};
  }

  if (typeof data === "string") return data;

  if (data && typeof data === "object") {
    const result =
      data.output ??
      data.response ??
      data.text ??
      data.message;

    if (typeof result === "string") return result;

    if (result !== undefined) return JSON.stringify(result, null, 2);

    return JSON.stringify(data, null, 2);
  }

  return String(data);
}

async function sendMessage(retryText = null) {
  if (busy) return;

  const question = retryText ?? input.value.trim();

  if (!question) return;

  if (!retryText) {
    addMessage(question, "user-message");
    input.value = "";
  }

  busy = true;
  sendBtn.disabled = true;
  sendBtn.textContent = "...";

  const loading = addMessage("VISHWA AI જવાબ તૈયાર કરી રહ્યું છે...", "ai-message");
  loading.classList.add("loading");

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 60000);

  try {
    const response = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        question: question
      }),
      signal: controller.signal
    });

    const responseText = await response.text();

    if (!response.ok) {
      throw new Error(
        "Server Error " + response.status + ": " +
        (responseText || "સર્વર તરફથી જવાબ મળ્યો નથી.")
      );
    }

    let data;

    try {
      data = JSON.parse(responseText);
    } catch {
      data = responseText;
    }

    const answer = getAIResponse(data);

    if (!answer || answer === "{}") {
      throw new Error("AI તરફથી ખાલી જવાબ મળ્યો.");
    }

    loading.remove();
    addMessage(answer, "ai-message");

  } catch (error) {
    loading.remove();

    let message = "કનેક્શન સમસ્યા આવી છે.";

    if (error.name === "AbortError") {
      message = "60 સેકન્ડમાં જવાબ મળ્યો નથી. Workflow તપાસવાની જરૂર છે.";
    } else if (error.message) {
      message = error.message;
    }

    const errorBox = addMessage(
      "VISHWA AI Error: " + message,
      "error-message"
    );

    const retry = document.createElement("button");
    retry.className = "retry-btn";
    retry.textContent = "ફરી પ્રયાસ કરો";

    retry.addEventListener("click", function() {
      errorBox.remove();
      sendMessage(question);
    });

    errorBox.appendChild(document.createElement("br"));
    errorBox.appendChild(retry);

  } finally {
    clearTimeout(timeout);
    busy = false;
    sendBtn.disabled = false;
    sendBtn.textContent = "મોકલો";
    input.focus();
    scrollBottom();
  }
}
</script>

</body>
</html>
